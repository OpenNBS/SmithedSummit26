[project]
authors = [{name = "Bentroen"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
description = "Note Block Studio data pack + resource pack for Smithed Summit 2026"
name = "nbs-summit26"
readme = "README.md"
requires-python = ">=3.14,<4"
version = "0.1.0"

dependencies = [
  "beet>=0.115.0,<0.116",
  "bolt>=0.50.1,<0.51",
  "nbs-summit26-booth",
  "nbs-summit26-playback",
  "nbs-summit26-shared",
]

[dependency-groups]
dev = [
  "basedpyright>=1.39.9",
  "poethepoet>=0.37.0",
  "ruff>=0.12.0",
  "snakeviz>=2.2.2",
  "tuna>=0.5.15",
]
scripts = [
  "boto3>=1.38.0,<2",
  "python-dotenv>=1.1.0,<2",
]

[tool.uv]
default-groups = ["dev", "scripts"]

[tool.uv.sources]
nbs-summit26-booth = {workspace = true}
nbs-summit26-playback = {workspace = true}
nbs-summit26-shared = {workspace = true}

[tool.uv.workspace]
members = ["packages/*"]

[tool.poe.tasks.build]
cmd = "beet"
help = "Build the full project (root beet.yml)"

[tool.poe.tasks.link]
cmd = "beet link"
help = "Link built packs to a Minecraft installation"

[tool.poe.tasks.booth]
cmd = "beet"
cwd = "packages/booth"
help = "Build the booth package"

[tool.poe.tasks.booth-watch]
cmd = "beet watch --reload"
cwd = "packages/booth"
help = "Watch and rebuild the booth package"

[tool.poe.tasks.playback]
cmd = "beet --project beet_prd.yml --log INFO"
cwd = "packages/playback"
help = "Build the playback package for production"

[tool.poe.tasks.playback-debug]
cmd = "beet --project beet_dev.yml --log DEBUG"
cwd = "packages/playback"
help = "Build the playback package for development"

[tool.poe.tasks.playback-watch]
cmd = "beet --project beet_watch.yml watch --reload"
cwd = "packages/playback"
help = "Watch and rebuild the playback package"

[tool.poe.tasks.playback-cprofile]
cwd = "packages/playback"
help = "Profile the playback package build with cProfile (writes playback.prof)"
sequence = [
  {cmd = "beet cache --clear mecha"},
  {cmd = "python -m cProfile -o playback.prof -m beet --project beet.yml --log DEBUG"},
]

[tool.poe.tasks.playback-profile]
cwd = "packages/playback"
help = "Profile the playback package build and open in snakeviz"
sequence = [
  "playback-cprofile",
  {cmd = "snakeviz playback.prof"},
]

[tool.poe.tasks.playback-profile-tuna]
cwd = "packages/playback"
help = "Profile the playback package build and open in tuna (better for deep call graphs)"
sequence = [
  "playback-cprofile",
  {cmd = "tuna playback.prof"},
]

[tool.poe.tasks.download-songs]
cmd = "uv run scripts/download_songs.py"
help = "Download song files and update the submissions manifest"

[tool.poe.tasks.create-thumbnails]
cmd = "uv run scripts/create_thumbnail.py"
help = "Generate booth thumbnails from remote song files"

[tool.poe.tasks.lint]
cmd = "ruff check ."
help = "Lint the workspace with Ruff"

[tool.poe.tasks.typecheck]
cmd = "basedpyright"
help = "Type-check the workspace with basedpyright"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["_lib", "nbs_shared", "src"]

# Shared by basedpyright CLI and Pylance (reads [tool.pyright]).
# Per-package executionEnvironments keep each package's `src` import root isolated.
[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.14"
include = [
  "packages/booth",
  "packages/playback",
  "packages/shared",
  "scripts",
]
exclude = [
  "**/__pycache__",
  "**/.beet_cache",
  "**/dist",
]
executionEnvironments = [
  { root = "packages/booth", extraPaths = ["packages/booth", "packages/shared"] },
  { root = "packages/playback", extraPaths = [
    "packages/playback",
    "packages/shared",
  ] },
  { root = "packages/shared", extraPaths = ["packages/shared"] },
  { root = "scripts", extraPaths = ["scripts"] },
]
