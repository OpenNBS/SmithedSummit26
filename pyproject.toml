[project]
name = "nbs-summit26"
version = "0.1.0"
description = "Note Block Studio data pack + resource pack for Smithed Summit 2026"
authors = [{ name = "Bentroen" }]
requires-python = ">=3.14,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "beet>=0.115.0,<0.116",
    "bolt>=0.50.1,<0.51",
    "nbs-summit26-booth",
    "nbs-summit26-playback",
    "nbs-summit26-shared",
]

[dependency-groups]
dev = [
    "poethepoet>=0.37.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
nbs-summit26-booth = { workspace = true }
nbs-summit26-playback = { workspace = true }
nbs-summit26-shared = { workspace = true }

[tool.uv.workspace]
members = ["booth", "playback", "shared"]

[tool.poe.tasks.build]
help = "Build the full project (root beet.yml)"
cmd = "beet"

[tool.poe.tasks.link]
help = "Link built packs to a Minecraft installation"
cmd = "beet link"

[tool.poe.tasks.booth]
help = "Build the booth package"
cmd = "beet"
cwd = "booth"

[tool.poe.tasks.booth-watch]
help = "Watch and rebuild the booth package"
cmd = "beet watch --reload"
cwd = "booth"

[tool.poe.tasks.playback]
help = "Build the playback package"
cmd = "beet"
cwd = "playback"

[tool.poe.tasks.playback-watch]
help = "Watch and rebuild the playback package"
cmd = "beet watch --reload"
cwd = "playback"

[tool.poe.tasks.download-songs]
help = "Download song files and update the submissions manifest"
cmd = "uv run scripts/download_songs.py"

[tool.poe.tasks.create-thumbnails]
help = "Generate booth thumbnails from remote song files"
cmd = "uv run scripts/create_thumbnail.py"
