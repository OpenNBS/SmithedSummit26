[project]
name = "nbs-summit26-shared"
version = "0.1.0"
description = "Shared utilities for Note Block Studio data packs"
authors = [{ name = "Bentroen" }]
requires-python = ">=3.14,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "boto3>=1.38.0,<2",
    "pillow>=12.0.0,<13",
    "pyoxipng>=9.1.1,<10",
    "python-dotenv>=1.1.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nbs_shared"]
