id: nbs

data_pack:
  name: nbs-smithed-summit-26-dp
  description: "Data pack for NBS on the Smithed Summit 2026"
  load: [src]
  zipped: true

resource_pack:
  name: nbs-smithed-summit-26-rp
  description: "Resource pack for NBS on the Smithed Summit 2026"
  load: [src]
  zipped: true

pipeline:
  - src.modules.dialogs
  - src.modules.models
  - src.modules.paintings
  - src.modules.textures
  - src.modules.thumbnails
  - src.main
  - beet.contrib.minify_json

output: dist
