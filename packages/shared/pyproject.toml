[project]
name = "nbs-summit26-shared"
version = "0.1.0"
description = "Shared utilities for Note Block Studio data packs"
authors = [{ name = "Bentroen" }]
requires-python = ">=3.14,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pillow>=12.0.0,<13",
    "pydantic>=2.12.0,<3",
    "pyoxipng>=9.1.1,<10",
]

# A build backend makes this workspace member editable-installable by uv.
# Without it, uv treats the project as virtual and nbs_shared isn't importable.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nbs_shared"]
