# Base configuration. Do not use directly; use one of the extended configs.
#
# `directory` moves the project root to packages/playback so `src.*` imports
# resolve. `extend: beet.yml` is then loaded from that directory (playback's
# base config). Event-specific pack names and meta overlay on top.

id: nbs-summit26-event

directory: "../playback"
extend: beet.yml

data_pack:
  name: nbs-summit26-event-dp
  description: "Animated note block music performance\nby OpenNBS"
  # `directory` is packages/playback, so paths resolve from there. Child
  # `load` replaces the parent list — re-declare playback modules, then
  # overlay event.bolt and the vendored animation pack.
  load:
    - data/nbs/module: src
    - data/nbs/module: ../event/src
    - ../../vendor/event/nbs-summit26-event-anim-dp.zip

resource_pack:
  name: nbs-summit26-event-rp
  description: "Animated note block music performance\nby OpenNBS"
  load:
    - ../../vendor/event/nbs-summit26-event-anim-rp.zip

# Resolved from packages/playback → packages/event/dist
output: "../event/dist"

meta:
  include_advancements: false
  song_manifest_path: "manifest_event.json"

  # The vendored animation pack ships ~14.7k functions (~190 MB) that Mecha
  # would parse and re-serialize for no benefit. Skipping them keeps the files
  # in the output pack verbatim.
  mecha:
    match:
      - "*"
      - "!animated_java:*"
      - "!nbs_show:*"

  bolt:
    entrypoint:
      - nbs:main

