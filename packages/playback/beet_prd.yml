id: nbs

data_pack:
  name: nbs-summit26-playback-dp
  description: "Smithed Summit 2026 OpenNBS playback system"

  load:
    - data/nbs/module: src

  zipped: true

resource_pack:
  name: nbs-summit26-playback-rp
  description: "Smithed Summit 2026 OpenNBS playback system"

require:
  - bolt

pipeline:
  - mecha
  #- src.sounds

meta:
  bolt:
    entrypoint: "nbs:main"
  debug: true # TODO: change to 'false' for production build
  song_manifest_path: "manifest.json"

output: dist
