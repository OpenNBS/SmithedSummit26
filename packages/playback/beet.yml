# Base configuration. Do not use directly; use one of the extended configs.

id: nbs

data_pack:
  name: nbs-summit26-playback-dp
  description: "Smithed Summit 2026 OpenNBS playback system"
  load:
    - data/nbs/module: src

resource_pack:
  name: nbs-summit26-playback-rp
  description: "Smithed Summit 2026 OpenNBS playback system"

require:
  - bolt
  - bolt.contrib.defer

pipeline:
  - src.config
  - src.sounds
  # Pre-Mecha: render storage and publish the sparse chord-size leaf set.
  # Post-Mecha: write NBT and inject large raw debug loader commands.
  - src.generate_song_storage
  - mecha

meta:
  minecraft: "26.2"
  vanilla:
    version: "26.2"
  bolt:
    entrypoint: "nbs:main"

  include_advancements: true
  autoadvance_songs: true
  autoadvance_delay_seconds: 2.0
  shuffle_songs: false

  # range: distance from the speaker to where the song starts being audible
  # inner_range: distance from the speaker to where the song is fully audible
  # stereo_separation: distance between the left/right stereo channels
  speaker_ranges:
    - name: short
      outer_range: 12
      inner_range: 9
      stereo_separation: 4
    - name: mid
      outer_range: 20
      inner_range: 16
      stereo_separation: 8
    - name: long
      outer_range: 32
      inner_range: 24
      stereo_separation: 8

  # Number of 'play' animation variants in the AJ speaker models
  speaker_anim_variant_count: 6

  region_colors:
    plateaus: "#DB6EFF"
    tropics: "#18F02E"
    woodlands: "#55FF55"
    event: "#9A45FF"

output: dist
