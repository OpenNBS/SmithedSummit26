# Base configuration. Do not use directly; use one of the extended configs.

id: nbs

data_pack:
  name: nbs-summit26-playback-dp
  description: "Smithed Summit 2026 OpenNBS playback system"
  load:
    - data/nbs/module: src

resource_pack:
  name: nbs-summit26-playback-rp
  description: "Smithed Summit 2026 OpenNBS playback system"

require:
  - bolt
  - bolt.contrib.defer

pipeline:
  - src.config
  - src.sounds
  # Pre-Mecha: render storage and publish the sparse chord-size leaf set.
  # Post-Mecha: write NBT and inject large raw debug loader commands.
  - src.generate_song_storage
  - mecha

meta:
  minecraft: "26.2"
  vanilla:
    version: "26.2"
  bolt:
    entrypoint: "nbs:main"

  include_advancements: true
  autoadvance_songs: true
  autoadvance_delay_seconds: 2.0
  shuffle_songs: false

output: dist
