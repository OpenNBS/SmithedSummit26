# Beet config for used for live reload (development). We leave it as beet.yml
# because the 'beet watch' command currently does not support changing the project.

extend: beet_base.yml

data_pack:
  zipped: false

resource_pack:
  zipped: false

output: dist

meta:
  debug: true
  song_manifest_path: "manifest_debug.json"
